services:
  iventoy:
    image: xkand/iventoy:latest
    container_name: iventoy
    restart: always
    tty: true
    stdin_open: true
    hostname: iventoy
    # PXE/DHCP/TFTP 必须使用 host 网络（bridge 下客户端收不到 DHCP 广播）
    network_mode: host
    # iVentoy 需要挂载 ISO 文件读取内容（SYS_ADMIN），PXE 需要网络相关权限
    privileged: true
    # cap_add:
    #   - SYS_ADMIN
    #   - NET_ADMIN
    #   - NET_RAW
    #   - NET_BIND_SERVICE
    # # 若上述权限仍不足，可改为 privileged: true
    volumes:
      - ./iso:/opt/iventoy/iso      # 放 ISO 文件的目录
      - ./data:/opt/iventoy/data    # 配置 / License
      - ./user:/opt/iventoy/user    # 自动安装脚本、注入文件
      - ./log:/opt/iventoy/log      # 日志
    environment:
      - TZ=Asia/Shanghai
      # 设为 1 时自动按上次配置启动 PXE 服务（需先在页面上配置并启动过一次）
      - AUTO_RUN=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
